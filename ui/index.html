<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // Resolve appearance before CSS, authentication or React can paint.
      (() => {
        let theme = "system";
        try {
          const saved = localStorage.getItem("theme");
          if (["light", "dark", "system"].includes(saved)) theme = saved;
        } catch { /* Appearance still works when browser storage is unavailable. */ }
        const dark = theme === "dark" || (theme === "system" && window.matchMedia?.("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <script>
      // Fetch resolves at headers. Drain the body within the same deadline and
      // detach its bytes, even when a route never consumes its startup response.
      const startupRead = (url, priority = 'low') => {
        const controller = new AbortController();
        let timer;
        const deadline = new Promise(resolve => {
          timer = setTimeout(() => {
            controller.abort(new DOMException('Startup response timed out.', 'TimeoutError'));
            resolve(null);
          }, 20000);
        });
        const request = (async () => {
          try {
            const response = await fetch(url, {
              credentials: 'same-origin', cache: 'no-store', priority, signal: controller.signal
            });
            if (!response) return null;
            const bytes = await response.arrayBuffer();
            return new Response([204, 205, 304].includes(response.status) ? null : bytes, {
              status: response.status, statusText: response.statusText, headers: response.headers
            });
          } catch { return null; }
        })();
        return Promise.race([request, deadline]).finally(() => clearTimeout(timer));
      };
      // Start session verification alongside assets, before React is downloaded.
      // Consumed once, never persisted, and validated by the normal auth client.
      window.__trainingSessionRequest = startupRead('/api/handler?__api_route=auth%2Fsession', 'high');
      // Each request still passes the server's full session checks. Overlap the
      // protected snapshot with auth instead of adding another startup waterfall.
      if (/^\/(?:calendar|week|nutrition|settings|atp|annual-plan)?\/?$/.test(location.pathname)) {
        let version;
        try { const metadata = JSON.parse(localStorage.getItem('training-agent-startup-metadata-v1') || 'null'); if (typeof metadata?.version === 'string' && metadata.version.length <= 200) version = metadata.version; } catch {}
        window.__trainingContextVersion = version;
        window.__trainingContextRequest = startupRead(version ? '/api/handler?__api_route=training-updates&version=' + encodeURIComponent(version) : '/api/handler?__api_route=training-context&scope=full');
      }
      // Only the open workspace starts these protected reads; no other pages
      // are crawled and no private response is persisted by this bootstrap.
      const workspaceReads = {
        '/coach': ['/api/coach/reports/catalog'], '/library': ['/api/workout-library'],
        '/atp': ['/api/annual-plans'], '/annual-plan': ['/api/annual-plans'],
        '/settings': ['/api/race-events'],
        '/workout-reports': ['/api/training-preferences'],
      }[location.pathname.replace(/\/+$/, '')];
      if (workspaceReads) window.__workspaceStartupRequests = Object.fromEntries(workspaceReads.map(path => [path, startupRead('/api/handler?__api_route=' + encodeURIComponent(path.slice(5)))]));
      if (location.pathname.replace(/\/+$/, '') === '/workout-reports') {
        let range = 'all', version = '', cachedUntil = 0;
        try { range = JSON.parse(sessionStorage.getItem('workout-reports-view-v1') || 'null')?.filters?.range || 'all'; } catch {}
        try {
          const metadata = JSON.parse(localStorage.getItem('training-agent-startup-metadata-v1') || 'null');
          if (typeof metadata?.version === 'string' && metadata.version.length <= 200) version = metadata.version;
          const history = JSON.parse(localStorage.getItem('training-agent-reports-startup-v1') || 'null');
          if (history?.version === version && Number.isFinite(history.expires) && history.expires <= Date.now() + 900000) cachedUntil = history.expires;
        } catch {}
        // Filtered reports retain their selected range. A fresh local archive
        // needs no speculative server read; otherwise overlap its first page.
        if (range === 'all' && cachedUntil <= Date.now()) {
          const path = '/api/workout-history?&version=' + encodeURIComponent(version);
          window.__workspaceStartupRequests[path] = startupRead('/api/handler?__api_route=workout-history&version=' + encodeURIComponent(version));
        }
      }
      if (/^\/nutrition\/?$/.test(location.pathname)) {
        const date = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        window.__nutritionStartupRequest = { date, response: startupRead('/api/handler?__api_route=nutrition&date=' + date) };
      }
      if (location.pathname === '/' && window.matchMedia('(max-width: 767px)').matches) {
        const image = document.createElement('link');
        image.rel = 'preload'; image.as = 'image'; image.href = '/images/home/finish-texas.webp'; image.fetchPriority = 'high';
        document.head.appendChild(image);
      }
    </script>
    <style>
      html { background: #fff; color-scheme: light; }
      html.dark { background: #0a0a0a; color-scheme: dark; }
      body { margin: 0; }
      /* This public shell can paint without fonts, stylesheets, React or auth. */
      #root { visibility: hidden; }
      html[data-app-ready] #root { visibility: visible; }
      #app-boot { --boot-bg: #f5f5f7; --boot-card: #fff; --boot-line: #e8e8ed; position: fixed; inset: 0; z-index: 10000; overflow: hidden; color: #18181b; background: var(--boot-bg); font: 14px system-ui, sans-serif; }
      .dark #app-boot { --boot-bg: #111318; --boot-card: #1b1d23; --boot-line: #30333b; color: #fafafa; }
      #app-boot * { box-sizing: border-box; }
      #app-boot header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
      #app-boot strong { font-size: 20px; font-style: italic; letter-spacing: -1px; }
      #app-boot .boot-dot { width: 40px; height: 40px; border-radius: 50%; background: var(--boot-card); }
      #app-boot .boot-content { display: grid; gap: 12px; padding: 16px; }
      #app-boot .boot-card { display: flex; flex-direction: column; justify-content: space-between; padding: 20px; height: 160px; border: 1px solid var(--boot-line); border-radius: 20px; background: var(--boot-card); }
      #app-boot .boot-card:first-child { height: 320px; }
      #app-boot .boot-desktop-card { display: none; }
      #app-boot .boot-line { display: block; height: 12px; width: 65%; border-radius: 6px; background: var(--boot-line); }
      #app-boot .boot-title { height: 24px; width: 75%; margin-top: 16px; }
      #app-boot .boot-chart { height: 72px; width: 100%; }
      #app-boot .boot-metrics { display: flex; gap: 24px; }
      #app-boot .boot-metrics .boot-line { height: 28px; flex: 1; }
      #app-boot footer { position: absolute; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); height: 64px; display: flex; align-items: center; justify-content: space-around; border: 1px solid var(--boot-line); border-radius: 30px; background: var(--boot-card); }
      #app-boot footer span { width: 24px; height: 24px; border: 2px solid var(--boot-line); border-radius: 7px; }
      #boot-retry { position: absolute; inset: auto 20px 96px; padding: 16px; border-radius: 16px; background: var(--boot-card); text-align: center; }
      #boot-retry[hidden] { display: none; }
      #boot-retry button { color: inherit; background: var(--boot-line); border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; }
      #app-boot[data-page="Calendar"] .boot-card:first-child { height: 210px; }
      #app-boot[data-page="Calendar"] .boot-card { height: 210px; }
      @media (width < 48rem) {
        #app-boot[data-page="Home"][data-home-layout="redesign"] header { position: absolute; inset: 0 0 auto; }
        #app-boot[data-page="Home"][data-home-layout="redesign"] .boot-content { padding: 0 20px; gap: 25px; }
        #app-boot[data-page="Home"][data-home-layout="redesign"] .boot-card:first-child { height: 359px; margin-inline: -20px; padding-top: 76px; border-radius: 0 0 30px 30px; }
        #app-boot[data-page="Home"][data-home-layout="redesign"] .boot-card:nth-child(2) { height: 270px; border-radius: 22px; }
      }
      @media (min-width: 768px) {
        html { scrollbar-gutter: stable; }
        #app-boot { --boot-bg: #fff; padding-left: 72px; }
        .dark #app-boot { --boot-bg: #0a0a0a; --boot-card: #171717; --boot-line: #303030; }
        #app-boot[data-page="Calendar"] { --boot-line: #d3dce7; color: #172b46; }
        .dark #app-boot[data-page="Calendar"] { --boot-bg: #111820; --boot-card: #1a2430; --boot-line: #3a4b60; color: #edf3fb; }
        #app-boot::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 71px; border-right: 1px solid var(--boot-line); }
        #app-boot .boot-content { max-width: 1500px; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px; }
        #app-boot .boot-card { border-radius: 12px; }
        #app-boot .boot-card:first-child { grid-row: span 2; height: 385px; }
        #app-boot[data-page="Home"] .boot-content { max-width: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        #app-boot[data-page="Home"] .boot-card:first-child { grid-column: 1 / -1; grid-row: 1; }
        #app-boot[data-page="Home"] .boot-card:nth-child(2) { grid-column: 1 / -1; grid-row: 2; height: 240px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(3) { grid-column: 1; grid-row: 3; height: 195px; }
        #app-boot[data-page="Home"] .boot-desktop-card { display: flex; }
        #app-boot[data-page="Home"] .boot-card:nth-child(4) { grid-column: 2; grid-row: 3; height: 195px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(5) { grid-column: 1; grid-row: 5; }
        #app-boot[data-page="Home"] .boot-card:nth-child(6) { grid-column: 2; grid-row: 5; }
        #app-boot[data-page="Home"] .boot-card:nth-child(7) { grid-column: 1 / -1; grid-row: 4; height: 174px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(8) { grid-column: 1; grid-row: 6; height: 408px; margin-top: 8px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(9) { grid-column: 2; grid-row: 6; height: 408px; margin-top: 8px; }
        #app-boot footer { display: none; }
      }
      @media (min-width: 1024px) {
        #app-boot[data-page="Home"] .boot-content { max-width: none; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 16px; }
        #app-boot[data-page="Home"] .boot-card { min-width: 0; height: 184.5px; }
        #app-boot[data-page="Home"] .boot-card:first-child { grid-column: 1 / span 8; grid-row: 1 / span 2; height: 385px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(2) { grid-column: 9 / span 4; grid-row: 1; height: 184.5px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(3) { grid-column: 13 / span 2; grid-row: 1; height: 184.5px; }
        #app-boot[data-page="Home"] .boot-desktop-card { display: flex; }
        #app-boot[data-page="Home"] .boot-card:nth-child(4) { grid-column: 15 / span 2; grid-row: 1; height: 184.5px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(5) { grid-column: 9 / span 2; grid-row: 2; height: 184.5px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(6) { grid-column: 11 / span 2; grid-row: 2; height: 184.5px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(7) { grid-column: 13 / span 4; grid-row: 2; height: 184.5px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(8) { grid-column: 1 / span 8; grid-row: 3; height: 408px; margin-top: 8px; }
        #app-boot[data-page="Home"] .boot-card:nth-child(9) { grid-column: 9 / span 8; grid-row: 3; height: 408px; margin-top: 8px; }
      }
      #app-boot[data-page="Workspace"] .boot-content { grid-template-columns: minmax(0, 1fr); max-width: 900px; margin: 0 auto; gap: 12px; }
      #app-boot[data-page="Workspace"] .boot-card { display: flex; height: 64px; grid-row: auto; padding: 16px; border-radius: 12px; }
      #app-boot[data-page="Workspace"] .boot-card:first-child { height: 96px; }
      #app-boot[data-page="Workspace"] .boot-chart, #app-boot[data-page="Workspace"] .boot-metrics { display: none; }
      #app-boot[data-page="Workspace"] .boot-title { height: 12px; width: 45%; margin-top: 0; }
      #app-boot[data-page="Annual Plan"] .boot-content { grid-template-columns: minmax(0, 1fr); max-width: none; }
      #app-boot[data-page="Annual Plan"] .boot-card { display: flex; height: 40px; grid-row: auto; border-radius: 4px; }
      #app-boot[data-page="Annual Plan"] .boot-card:first-child { height: 160px; }
    </style>
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/alphacorsa-italic.ttf" as="font" type="font/ttf" crossorigin media="(width < 48rem)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="512x512" href="/ar-performance-favicon.png" />
    <link rel="apple-touch-icon" href="/ar-performance-pwa-icon-v3.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AR Performance</title>
  </head>
  <body>
    <div id="app-boot" role="status" aria-label="Opening AR Performance" aria-busy="true">
      <div aria-hidden="true">
        <header><span class="boot-dot"></span><strong>AR Performance</strong><span class="boot-dot"></span></header>
        <div class="boot-content">
          <div class="boot-card"><div><span class="boot-line"></span><span class="boot-line boot-title"></span></div><span class="boot-line boot-chart"></span><div class="boot-metrics"><span class="boot-line"></span><span class="boot-line"></span><span class="boot-line"></span></div></div>
          <div class="boot-card"><span class="boot-line boot-title"></span><span class="boot-line"></span></div>
          <div class="boot-card"><span class="boot-line boot-title"></span><span class="boot-line"></span></div>
          <div class="boot-card boot-desktop-card"><span class="boot-line boot-title"></span><span class="boot-line"></span></div>
          <div class="boot-card boot-desktop-card"><span class="boot-line boot-title"></span><span class="boot-line"></span></div>
          <div class="boot-card boot-desktop-card"><span class="boot-line boot-title"></span><span class="boot-line"></span></div>
          <div class="boot-card boot-desktop-card"><span class="boot-line boot-title"></span><span class="boot-line"></span></div>
          <div class="boot-card boot-desktop-card"><span class="boot-line boot-title"></span><span class="boot-line boot-chart"></span><span class="boot-line"></span></div>
          <div class="boot-card boot-desktop-card"><span class="boot-line boot-title"></span><span class="boot-line boot-chart"></span><span class="boot-line"></span></div>
        </div>
        <footer><span></span><span></span><span></span><span></span><span></span></footer>
      </div>
      <div id="boot-retry" hidden><p>Taking longer than usual. Reload to try again.</p><button type="button" onclick="location.reload()">Reload</button></div>
      <noscript>Enable JavaScript to open your training app.</noscript>
    </div>
    <script id="app-boot-script">
      (() => {
        const shell = document.getElementById('app-boot');
        shell.dataset.page = /^\/(calendar|week)\/?$/.test(location.pathname) ? 'Calendar' : /^\/(atp|annual-plan)\/?$/.test(location.pathname) ? 'Annual Plan' : /^\/(coach|settings|library|workout-reports)\/?$/.test(location.pathname) ? 'Workspace' : 'Home';
        try { shell.dataset.homeLayout = localStorage.getItem('ar-performance:mobile-home-layout') === 'classic' ? 'classic' : 'redesign'; } catch { shell.dataset.homeLayout = 'redesign'; }
        const retry = () => { document.getElementById('boot-retry').hidden = false; };
        const timer = setTimeout(retry, 15000);
        let mounted = false;
        const finish = () => {
          const styles = [...document.querySelectorAll('link[data-app-style]')];
          if (styles.some(link => link.dataset.failed)) { retry(); return; }
          if (!mounted || styles.some(link => link.dataset.ready !== 'true')) return;
          clearTimeout(timer);
          document.documentElement.setAttribute('data-app-ready', '');
          shell.remove();
          window.removeEventListener('training-styles-ready', finish);
          delete window.__trainingFinishBoot;
        };
        window.__trainingFinishBoot = () => { mounted = true; finish(); };
        window.addEventListener('training-styles-ready', finish);
        if (new URLSearchParams(location.search).get('performance') === '1') {
          try {
            const observer = new PerformanceObserver(list => {
              for (const entry of list.getEntries()) console.info('[training-performance]', JSON.stringify({phase: entry.name, ms: Math.round(entry.startTime)}));
            });
            observer.observe({type: 'paint', buffered: true});
            const largest = new PerformanceObserver(list => {
              for (const entry of list.getEntries()) console.info('[training-performance]', JSON.stringify({phase: 'largest-contentful-paint', ms: Math.round(entry.startTime)}));
            });
            largest.observe({type: 'largest-contentful-paint', buffered: true});
          } catch { /* Paint diagnostics are optional on older browsers. */ }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
