<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Mobile verification frame</title></head>
<body style="margin:0;background:#e5e7eb;font:14px system-ui">
<p>Isolated fixtures — no live account. <select aria-label="Viewport width" id="width"><option>390</option><option>320</option><option>430</option><option>768</option></select> <select aria-label="Fixture" id="fixture"><option value="Run">Run</option><option value="Ride">Bike</option><option value="Long">20 laps</option></select> <button id="check">Check layout</button> <button id="gestures">Test report gestures</button> <button id="terms-gestures">Test term gestures</button></p>
<iframe title="Mobile app" id="app" src="/tests/mobile-workout.html" style="width:390px;height:780px;border:0;background:white"></iframe>
<pre id="result" style="white-space:pre-wrap"></pre>
<script>
const frame = document.getElementById('app');
async function testSheetGestures(terms=false) {
 const doc=frame.contentDocument, win=frame.contentWindow, results=[];
 const wait=()=>new Promise(resolve=>setTimeout(resolve,350));
 const opened=()=>doc.querySelector(terms?'#terms-mobile-layer .terms-metric-sheet.modal-in':'.detail-sheet-full-height.modal-in');
 const termName=opened()?.querySelector('#terms-metric-title')?.textContent;
 const trigger=terms?Array.from(doc.querySelectorAll('.terms-mobile-metric-list .item-link')).find(el=>Array.from(el.querySelectorAll('.item-title,.item-subtitle')).some(text=>text.textContent===termName)):Array.from(doc.querySelectorAll('button')).find(el=>el.textContent.trim()==='Post-workout report');
 if(!trigger){document.getElementById('result').textContent=terms?'Open a term first':'Open the completed workout first';return;}
 if(!opened()){trigger.click();await wait();}
 const swipe=async (dx,dy,{cancel=false,scrolled=false,heading=false}={})=>{
   const sheet=opened(), reader=sheet.querySelector('[data-sheet-scroll]');
   reader.scrollTop=scrolled?200:0;
   const target=heading?sheet.querySelector('.terms-metric-sheet-heading h2'):(reader.querySelector('p')||reader);
   const emit=(type,x,y)=>{const touch=new win.Touch({identifier:1,target,clientX:x,clientY:y}); target.dispatchEvent(new win.TouchEvent(type,{bubbles:true,cancelable:true,touches:type==='touchend'||type==='touchcancel'?[]:[touch],changedTouches:[touch]}));};
   emit('touchstart',150,350);emit('touchmove',150+dx,350+dy);emit(cancel?'touchcancel':'touchend',150+dx,350+dy);await wait();
 };
 const assert=(name,value)=>{results.push(`${value?'PASS':'FAIL'} ${name}`);if(!value)throw new Error(name);};
 try{
   await swipe(0,120,{scrolled:true});assert('Reading scroll does not dismiss',!!opened());
   await swipe(0,-120);assert('Upward scroll does not dismiss',!!opened());
   await swipe(120,15);assert('Horizontal scroll does not dismiss',!!opened());
   await swipe(0,10);assert('Small movements do not dismiss',!!opened());
   await swipe(0,120,{cancel:true});assert('Cancelled touch resets',!!opened()&&!opened().style.transform);
   await swipe(0,120);assert('Downward swipe from content at top closes',!opened());
   trigger.click();await wait();assert('Details reopen after swipe',!!opened());
   await swipe(0,120,{scrolled:true,heading:true});assert('Title swipe closes halfway-scrolled details',!opened());
   trigger.click();await wait();
   opened().querySelector(terms?'[aria-label="Close metric details"]':'[aria-label="Close Post-workout report"]').click();await wait();assert('Close button works on first press',!opened());
   assert('Closing keeps the underlying page open',terms?!!doc.querySelector('.terms-mobile-page'):!!Array.from(doc.querySelectorAll('button')).find(el=>el.textContent.trim()==='View workout'));
   if(terms)assert('Focus returns to the selected term',doc.activeElement===trigger);
 }catch(error){results.push(error.message);}
 document.getElementById('result').textContent=results.join('\n');
}
document.getElementById('gestures').onclick=()=>testSheetGestures();
document.getElementById('terms-gestures').onclick=()=>testSheetGestures(true);
document.getElementById('width').onchange = event => frame.style.width = event.target.value + 'px';
document.getElementById('fixture').onchange = event => frame.src = '/tests/mobile-workout.html?sport=' + event.target.value + (event.target.value === 'Long' ? '&long=1' : '');
document.getElementById('check').onclick = () => {
 const doc=frame.contentDocument, win=frame.contentWindow;
 const inspect=selector=>Array.from(doc.querySelectorAll(selector)).map(el=>{const box=el.getBoundingClientRect(),css=win.getComputedStyle(el);return {label:el.getAttribute('aria-label')||el.textContent.slice(0,60),radius:css.borderRadius,shadow:css.boxShadow,overflow:css.overflowY,maxHeight:css.maxHeight,x:box.x,y:box.y,width:box.width,height:box.height}});
 document.getElementById('result').textContent=JSON.stringify({viewport:win.innerWidth,pageWidth:doc.documentElement.scrollWidth,scrollY:win.scrollY,splits:inspect('[aria-label="Workout splits"]'),laps:inspect('[aria-label="Laps table"]'),picker:inspect('.we-duration-picker'),cards:inspect('[aria-label="Performance Insights"] [data-slot="card"],.group\\/workout'),options:inspect('select[data-native-control="actions"]')},null,2);
};
</script></body></html>
