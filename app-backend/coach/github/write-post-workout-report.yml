name: Section 11 Report Worker (handled by app AI service)

on:
  workflow_run:
    workflows: ["Auto-Sync Intervals.icu Data"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - workout_reports.py
      - test_workout_reports.py
      - .github/workflows/write-post-workout-report.yml

permissions:
  contents: read

concurrency:
  group: section11-post-workout-reports
  cancel-in-progress: false

jobs:
  post-workout:
    # Report generation now runs in the app's AI service after the sync is
    # confirmed. Keeping this workflow disabled prevents the legacy Python
    # formatter from writing non-AI reports into Intervals.icu.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: pip install requests
      - name: Test report recovery and duplicate protection
        run: python test_workout_reports.py
      - name: Write and verify pre and post workout reports
        env:
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          TZ: America/Chicago
        run: python workout_reports.py
