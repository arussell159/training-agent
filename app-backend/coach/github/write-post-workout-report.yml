name: Write Section 11 Post-Workout Reports

on:
  workflow_run:
    workflows: ["Auto-Sync Intervals.icu Data"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - workout_reports.py
      - test_workout_reports.py
      - .github/workflows/write-post-workout-report.yml

permissions:
  contents: read

concurrency:
  group: section11-post-workout-reports
  cancel-in-progress: false

jobs:
  post-workout:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: pip install requests
      - name: Test report recovery and duplicate protection
        run: python test_workout_reports.py
      - name: Write and verify pre and post workout reports
        env:
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          TZ: America/Chicago
        run: python workout_reports.py
