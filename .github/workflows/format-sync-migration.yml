name: Format SECTION_11 migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-sync-migration.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app-backend/lib/*.mjs *.md
          git commit -m "Format SECTION_11 sync migration"
          git push origin HEAD:main
