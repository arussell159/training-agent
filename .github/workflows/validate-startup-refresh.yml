name: Validate startup GitHub refresh
on:
  push:
    branches: [fix/startup-github-refresh-20260922]
    paths: ['.github/workflows/validate-startup-refresh.yml']
permissions:
  contents: write
concurrency:
  group: startup-github-refresh-review
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply reviewed startup-only change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def patch(name, sha, changes):
              p = Path(name)
              data = p.read_bytes()
              actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if actual != sha:
                  raise RuntimeError('Source changed: '+name)
              text = data.decode()
              for before, after in changes:
                  if text.count(before) != 1:
                      raise RuntimeError('Patch anchor changed: '+name)
                  text = text.replace(before, after)
              p.write_text(text)
          helper = r'''import { createEncryptedRecordStore } from "./app-auth-store.mjs";
          import { createWorkoutSync, freshWorkoutSync } from "./coach-workout-sync.mjs";

          // Called only by the authenticated startup lease route, never by idle hints.
          // Reuse the manual-sync durable claim so open tabs cannot duplicate an
          // active app-dispatched run. No report service/model is initialized here.
          export async function refreshGithubOnStartup({
            config,
            bootstrap,
            createStore = createEncryptedRecordStore,
            fetchImpl = fetch,
          }) {
            if (!config.githubToken || !config.repo) {
              return {
                status: "unavailable",
                error: "GitHub startup refresh is not configured. Use the header Refresh after checking the training-data connection.",
              };
            }
            const store = createStore(bootstrap, `${config.repo}@${config.branch}/`, {
              namespace: "coach-sync",
              name: "COACH_WORKOUT_SYNC",
              fresh: freshWorkoutSync,
              timestampCas: true,
            });
            return createWorkoutSync({ config, store, fetchImpl }).refresh();
          }
          '''
          Path('app-backend/lib/startup-workout-refresh.mjs').write_text(helper)
          patch('app-backend/server.mjs', '0bceda2165e7ede41cfedb468655708ca750ddfa', [
              ("import { createWorkoutChangeProbe } from './lib/workout-change-probe.mjs';", "import { createWorkoutChangeProbe } from './lib/workout-change-probe.mjs';\nimport { refreshGithubOnStartup } from './lib/startup-workout-refresh.mjs';"),
              ("      const config=await readConfig(), snapshot=await loadSupabaseTrainingSnapshot(config);\n      if(!snapshot){sendJson(req,res,{needs_import:true});return;}\n      sendJson(req,res,{probe:await workoutChangeProbe.issue(req,snapshot)});return;", "      const config=await readConfig(), snapshot=await loadSupabaseTrainingSnapshot(config);\n      let startup_sync;\n      if(requestUrl.searchParams.get('startup')==='1') {\n        try {startup_sync=await refreshGithubOnStartup({config:coachConfig(),bootstrap:await readBootstrapConfig()});}\n        catch {startup_sync={status:'unavailable',error:'The GitHub startup refresh could not be confirmed. Use the header Refresh to check again.'};}\n      }\n      if(!snapshot){sendJson(req,res,{needs_import:true,startup_sync});return;}\n      sendJson(req,res,{probe:await workoutChangeProbe.issue(req,snapshot),startup_sync});return;")
          ])
          patch('ui/src/components/background-sync.tsx', 'ae2c7986abc7e013e39938a7888becde270cfde6', [
              ('import { useEffect, useState } from "react"', 'import { useEffect, useRef, useState } from "react"'),
              ('  const [error, setError] = useState("")', '  const [error, setError] = useState("")\n  const [startupError, setStartupError] = useState("")\n  const startupRequested = useRef(false)'),
              ('      const result = (await response.json()) as BackgroundSyncResult', '      const result = (await response.json()) as BackgroundSyncResult & {\n        startup_sync?: { status: string; error?: string }\n      }\n      if (active && result.startup_sync)\n        setStartupError(result.startup_sync.error || "")'),
              ('      issue: () => request("/api/sync/probe-lease"),', '      issue: () => {\n        // Claim before sending: rerenders, focus and ordinary retries must not\n        // dispatch another workflow. A fresh page load gets a fresh claim.\n        const startup = !startupRequested.current\n        startupRequested.current = true\n        return request(`/api/sync/probe-lease${startup ? "?startup=1" : ""}`)\n      },'),
              ('  return error || pending ? (', '  const visibleError = error || startupError\n  return visibleError || pending ? ('),
              ('      onClick={() => setRetry((v) => v + 1)}', '      onClick={() => {\n        if (startupError) startupRequested.current = false\n        setStartupError("")\n        setRetry((v) => v + 1)\n      }}'),
              ('      {error\n        ? `${error} Tap to retry.`', '      {visibleError\n        ? `${visibleError} Tap to retry.`')
          ])
          doc = Path('docs/WORKOUT_SYNC_POLICY.md')
          text = doc.read_text()
          heading = '## Scope\n'
          assert text.count(heading) == 1
          text = text.replace(heading, '''## Startup refresh

          On the first eligible startup after sign-in, the app requests one GitHub `auto-sync.yml` refresh while the cached dashboard remains usable. This is bundled into the existing authenticated startup lease request; there is no immediate full Intervals/Supabase rewrite just because the app opened. It reuses the manual-sync durable dispatch claim, including active-run deduplication and uncertain-write handling, without initializing application report generation.

          The app checks the mirror immediately after startup and continues the existing two-minute, visible/online-only addition checks. A newly seen activity triggers the existing protected incremental import. No placeholder workout is invented, and no successful workflow dispatch is presented as proof that a workout was imported. GitHub run/commit time and the mirror read cache can delay discovery.

          The startup request is once per mounted application load, not on focus, page rerenders, normal hint checks or ordinary sync retries. An explicit retry of a displayed startup error may reconcile/retry the request through the same durable claim. A browser reload starts a new startup request, but an already-active app-dispatched run is reused. This does not deduplicate an independently scheduled GitHub run. The startup dispatch uses the existing Supabase-backed claim once; unchanged idle checks remain database-free. The 24-hour historical-record policy below is unchanged.

          ## Scope
          ''')
          doc.write_text(text)
          tests = r'''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { refreshGithubOnStartup } from "./startup-workout-refresh.mjs";
          import { freshWorkoutSync } from "./coach-workout-sync.mjs";
          import { createBackgroundWorkoutSync } from "../../ui/src/lib/background-workout-sync.mjs";

          function fixture({ ambiguous = false } = {}) {
            const state = freshWorkoutSync();
            const calls = [];
            const scopes = [];
            const store = {
              read: async () => structuredClone(state),
              update: async (fn) => structuredClone(fn(state)),
            };
            const input = {
              config: { repo: "example/training-data", branch: "main", githubToken: "dummy-test-only" },
              bootstrap: {},
              createStore: (bootstrap, scope, options) => {
                scopes.push({ scope, options });
                return store;
              },
              fetchImpl: async (url, options = {}) => {
                calls.push({ url, method: options.method || "GET", body: options.body });
                assert.ok(url.startsWith("https://api.github.com/repos/example/training-data/"));
                if (url.endsWith("/dispatches")) {
                  if (ambiguous) throw Error("Synthetic response lost");
                  return Response.json({ workflow_run_id: 123, html_url: "https://github.com/example/training-data/actions/runs/123" });
                }
                if (url.endsWith("/actions/runs/123"))
                  return Response.json({ id: 123, event: "workflow_dispatch", head_branch: "main", path: ".github/workflows/auto-sync.yml", status: "in_progress" });
                if (url.includes("/runs?")) return Response.json({ workflow_runs: [] });
                throw Error("Unexpected provider/model request");
              },
            };
            return { state, calls, scopes, input };
          }
          test("startup dispatches the configured source workflow through the existing durable claim", async () => {
            const { input, calls, scopes } = fixture();
            const result = await refreshGithubOnStartup(input);
            assert.equal(result.status, "queued");
            assert.equal(result.runId, 123);
            assert.equal(calls.length, 1);
            assert.equal(calls[0].method, "POST");
            assert.ok(calls[0].url.endsWith("/actions/workflows/auto-sync.yml/dispatches"));
            const payload = JSON.parse(calls[0].body);
            assert.equal(payload.ref, "main");
            assert.equal(payload.inputs.request_id, result.requestId);
            assert.equal(scopes[0].scope, "example/training-data@main/");
            assert.equal(scopes[0].options.namespace, "coach-sync");
            assert.equal(scopes[0].options.name, "COACH_WORKOUT_SYNC");
            assert.equal(scopes[0].options.timestampCas, true);
          });
          test("simultaneous startups and a later startup reuse an active app-dispatched run", async () => {
            const { input, calls } = fixture();
            await Promise.all(Array.from({ length: 10 }, () => refreshGithubOnStartup(input)));
            const result = await refreshGithubOnStartup(input);
            assert.equal(result.status, "running");
            assert.equal(calls.filter(c => c.method === "POST").length, 1);
          });
          test("an uncertain startup dispatch is reconciled without a blind duplicate write", async () => {
            const { input, calls } = fixture({ ambiguous: true });
            assert.equal((await refreshGithubOnStartup(input)).status, "checking");
            assert.equal((await refreshGithubOnStartup(input)).status, "checking");
            assert.equal(calls.filter(c => c.method === "POST").length, 1);
          });
          test("missing startup GitHub configuration does not initialize storage or contact providers", async () => {
            const result = await refreshGithubOnStartup({
              config: {}, bootstrap: {},
              createStore: () => { throw Error("Unexpected database access"); },
              fetchImpl: () => { throw Error("Unexpected network access"); },
            });
            assert.equal(result.status, "unavailable");
            assert.ok(result.error);
          });
          test("startup stays optimistic: no context replacement until a new workout is confirmed", async () => {
            let issues = 0, imports = 0, changed = false;
            const contexts = [];
            const sync = createBackgroundWorkoutSync({
              issue: async () => { issues++; return { probe: { token: "before", baseline: "before" }, startup_sync: { status: "queued" } }; },
              probe: async token => ({ changed: changed && token === "before" }),
              importWorkouts: async () => { imports++; return { context: { verified: true }, probe: { token: "after", baseline: "after" } }; },
              flushEdits: async () => ({}),
              onContext: value => contexts.push(value),
            });
            await Promise.all([sync.start(), sync.start(), sync.start()]);
            for (let i = 0; i < 1000; i++) await sync.check();
            assert.equal(issues, 1);
            assert.equal(imports, 0);
            assert.deepEqual(contexts, []);
            changed = true;
            await sync.check();
            await sync.check();
            assert.equal(imports, 1);
            assert.deepEqual(contexts, [{ verified: true }]);
          });
          test("the startup flag is sent once and only its authenticated lease route can dispatch", () => {
            const ui = fs.readFileSync(new URL("../../ui/src/components/background-sync.tsx", import.meta.url), "utf8");
            assert.ok(ui.includes("startupRequested = useRef(false)"));
            assert.ok(ui.includes("const startup = !startupRequested.current"));
            const claim = ui.indexOf("startupRequested.current = true");
            assert.ok(claim > 0 && claim < ui.indexOf("?startup=1"));
            assert.ok(ui.includes('probe: (token) => request("/api/workout-changes", { token })'));
            assert.ok(ui.includes('importWorkouts: () => request("/api/sync?automatic=1")'));
            assert.ok(ui.includes("await check()"));
            const server = fs.readFileSync(new URL("../server.mjs", import.meta.url), "utf8");
            const auth = server.indexOf("if (await handleAuth(req, res, pathname)) return;");
            const route = server.indexOf("if(pathname==='/api/sync/probe-lease'");
            const flag = server.indexOf("requestUrl.searchParams.get('startup')==='1'");
            assert.ok(auth >= 0 && route > auth && flag > route);
            assert.equal((server.match(/await refreshGithubOnStartup\(/g) || []).length, 1);
          });
          '''
          Path('app-backend/lib/startup-workout-refresh.test.mjs').write_text(tests)
          print('Applied startup dispatch only; idle probes and the 24-hour history policy are unchanged.')
          PY
          node --check app-backend/server.mjs
      - name: Install and format changed files
        run: |
          npm ci
          npm ci --prefix ui --include=dev
          npx prettier --write app-backend/lib/startup-workout-refresh*.mjs docs/WORKOUT_SYNC_POLICY.md
          cd ui
          npx prettier --write src/components/background-sync.tsx
      - name: Test complete backend and quiet-idle regressions
        run: |
          if npm test > /tmp/startup-tests.log 2>&1; then tail -15 /tmp/startup-tests.log; else grep -A50 -B3 'not ok\|ERR_\|SyntaxError' /tmp/startup-tests.log; tail -15 /tmp/startup-tests.log; exit 1; fi
      - name: Format, lint and production build
        run: |
          npm run format:check
          npm run lint
          npm run build
      - name: Commit validated source only
        run: |
          rm .github/workflows/validate-startup-refresh.yml
          git add app-backend/server.mjs app-backend/lib/startup-workout-refresh.mjs app-backend/lib/startup-workout-refresh.test.mjs ui/src/components/background-sync.tsx docs/WORKOUT_SYNC_POLICY.md .github/workflows/validate-startup-refresh.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Request a single GitHub source refresh on app startup; retain optimistic cached display'
          git push origin HEAD:fix/startup-github-refresh-20260922
