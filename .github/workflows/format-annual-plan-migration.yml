name: Format Annual Plan Migration

on:
  push:
    branches: [main]
    paths:
      - 'format-requests/annual-plan'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format migration files
        run: npx prettier --write app-backend/lib/annual-plan-store.mjs app-backend/lib/local-context.mjs
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app-backend/lib/annual-plan-store.mjs app-backend/lib/local-context.mjs; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-backend/lib/annual-plan-store.mjs app-backend/lib/local-context.mjs
          git commit -m "Format annual plan migration files"
          git push origin main
