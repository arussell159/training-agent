name: Update Section 11

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm ci --prefix ui --include=dev
      - run: npm run section11:update
      - run: npm test
      - run: npm run build

      - name: Commit verified upstream update
        shell: bash
        run: |
          if git diff --quiet -- app-backend/vendor/section-11 app-backend/section-11-upstream.json; then
            echo "Section 11 is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-backend/vendor/section-11 app-backend/section-11-upstream.json
          git commit -m "Update Section 11 upstream"
          git push origin HEAD:main
